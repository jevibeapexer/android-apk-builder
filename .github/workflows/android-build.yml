name: Android Build

on:
  push:
    branches: [ "main", "master", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: app/build/reports/

  release:
    # Publishes the built APKs to a GitHub Release when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Debug APK artifact
      uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: dist

    - name: Download Release APK artifact
      uses: actions/download-artifact@v4
      with:
        name: app-release
        path: dist

    - name: Rename APKs with version
      run: |
        mv dist/app-debug.apk "dist/SampleApp-${GITHUB_REF_NAME}-debug.apk"
        mv dist/app-release-unsigned.apk "dist/SampleApp-${GITHUB_REF_NAME}-release-unsigned.apk"
        ls -la dist/

    - name: Create GitHub Release and attach APKs
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        body: |
          ## 📱 Downloads
          | File | Use |
          |------|-----|
          | `SampleApp-${{ github.ref_name }}-debug.apk` | Testing — debuggable, larger |
          | `SampleApp-${{ github.ref_name }}-release-unsigned.apk` | Distribution — needs signing first |
        files: dist/*.apk
